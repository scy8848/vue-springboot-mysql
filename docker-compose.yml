version: '3.8'

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: mori-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: mori_market
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mori-server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-root123456}@mysql:3306/mori_market
      CLIENT_URL: http://localhost:80
      JWT_SECRET: ${JWT_SECRET:-scy-mori-jwt-secret-2026-production-key-32chars}
      JWT_EXPIRES_IN: 7d
    ports:
      - "3001:3000"
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/src/index.js"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: mori-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mysql_data: